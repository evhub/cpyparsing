name: cPyparsing Test Suite
on: [push]
jobs:
  build:
    # EOL Pythons have to be built from source, which fails on newer Ubuntus (e.g. missing lzma-dev on 26.04)
    runs-on: ${{ contains(fromJSON('["2.7", "3.7", "3.8", "3.9"]'), matrix.python-version) && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version:
          - '2.7'
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
      fail-fast: false
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make install
      - run: make test
      - run: make build
      # (releases are published with wheels for every platform by the Build workflow when a GitHub release is published)
